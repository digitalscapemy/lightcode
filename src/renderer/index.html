<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Light Code</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:"
    />
  </head>
  <body>
    <div id="app">
      <header id="tabbar">
        <div id="tabs"></div>
        <button id="add-tab" title="New terminal tab (Ctrl+Shift+T)">+</button>
        <button id="tab-list-btn" title="More tabs" hidden>
          <span class="tab-list-count"></span>
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 L5 6.5 L8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <div class="spacer"></div>
        <!-- The toolbar. Icons, labels and tooltips are filled in by toolbar.ts
             from the icon set and the command registry, so a button can never
             describe a shortcut that does not work. Ids are what main.ts and
             the feature modules bind to. -->
        <button id="search-btn" class="search-pill" data-tip="Command palette" data-tip-desc="Find any command, tab or project by name">
          <span class="search-pill-icon" data-icon="search"></span>
          <span class="search-pill-text">Search or run a command</span>
          <span class="kbd" data-shortcut="command-palette"></span>
        </button>
        <div class="tb-group" role="group" aria-label="Layout">
          <button id="layout-btn" class="tabbar-btn" data-icon="layout" data-command="layout"></button>
        </div>
        <div class="tb-group tb-agents" role="group" aria-label="Agents">
          <button id="fanout-btn" class="tabbar-btn tb-labelled" data-icon="fanOut" data-label="Fan-out" data-command="fan-out"
            data-desc="One task, several agents, each in its own worktree"></button>
          <button id="squad-btn" class="tabbar-btn tb-labelled" data-icon="squad" data-label="Squad" data-command="squad"
            data-desc="An orchestrator directing developer, reviewer, devops and security roles"></button>
          <button id="orch-btn" class="tabbar-btn tb-labelled" data-icon="orchestra" data-label="Orchestra" data-command="orchestra"
            data-desc="Every lead and its workers, their state and reports" data-panel="orch-panel"></button>
        </div>
        <div class="tb-group" role="group" aria-label="Panels">
          <button id="git-btn" class="tabbar-btn" data-icon="worktrees" data-command="worktrees"
            data-desc="Every branch and worktree, and which pane is in it" data-panel="git-panel"></button>
          <button id="mission-btn" class="tabbar-btn" data-icon="mission" data-command="mission"
            data-desc="All Claude sessions at once; broadcast to many"></button>
        </div>
        <div class="tb-group" role="group" aria-label="Setup">
          <button id="projects-btn" class="tabbar-btn" data-icon="projects" data-command="projects"
            data-desc="Named folders you can jump to from any pane"></button>
          <button id="accounts-btn" class="tabbar-btn" data-icon="accounts" data-command="accounts"
            data-desc="Several Claude logins, one per config folder"></button>
        </div>
        <button id="version-btn" class="tabbar-btn version-btn" data-tip="About Light Code" data-tip-desc="Version, what is new, check for updates"></button>
        <div id="win-controls">
          <button id="win-min" title="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect y="4.5" width="10" height="1" fill="currentColor" /></svg>
          </button>
          <button id="win-max" title="Maximize / Restore">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" /></svg>
          </button>
          <button id="win-close" title="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
      </header>
      <!-- A row so the git tree can dock beside the panes rather than over
           them: it is meant to be read while you work, which a modal cannot be.
           #content keeps flex:1 and its absolutely-positioned tab views. -->
      <div id="workspace">
        <main id="content"></main>
        <aside id="git-panel" hidden></aside>
        <aside id="orch-panel" hidden></aside>
      </div>
      <!-- The welcome page (welcome.ts), shown whenever no tab is open. -->
      <div id="empty-state" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
