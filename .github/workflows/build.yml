# Builds the Windows installer and both macOS installers (Apple Silicon + Intel).
# - Push a v* tag  -> builds AND publishes/updates the GitHub Release (auto-update feed).
# - Manual run     -> builds artifacts only (no release).
#
# Publishing uses `gh release` instead of electron-builder's publisher:
# electron-builder can't append to an already-published release (it silently
# creates an orphaned draft), while `gh release upload --clobber` is idempotent.
#
# Why three separate build jobs instead of one cross-compiling job: `npm run dist`
# runs scripts/build-bytecode.cjs, which compiles the main process to V8 bytecode.
# That bytecode is architecture-specific, so an arm64 machine cannot produce a
# working x64 .jsc (or vice versa) -- the wrong arch fails at load with
# "Invalid or incompatible cached data". Each arch must build on its own runner.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One arch failing shouldn't throw away the others' artifacts.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --win
          # Apple Silicon (M1 and newer). macos-latest is arm64.
          - name: mac-arm64
            os: macos-latest
            args: --mac --arm64
          # Intel Macs. Note: macos-13 was retired in Dec 2025. The Intel labels
          # now are macos-15-intel and macos-26-intel; GitHub is dropping x86_64
          # hosting entirely around Aug 2027, after which Intel DMGs need another
          # builder (self-hosted, or drop Intel support).
          - name: mac-x64
            os: macos-15-intel
            args: --mac --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A tag that disagrees with package.json is the one release mistake that
      # fails *silently*: electron-builder stamps the feed from package.json, so
      # the published latest.yml advertises the OLD version, every installed app
      # concludes it is already up to date, and the release is simply never seen.
      # Nothing surfaces the mistake except users not updating. `npm version
      # <patch|minor|major>` bumps and tags together and cannot drift; this stops
      # the build in seconds when something else did the tagging.
      # bash explicitly: the Windows runner would otherwise run this in pwsh.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version and retag."
            exit 1
          fi
          # Only a warning: a release with no notes still updates correctly, it
          # just leaves the About dialog and the release page with nothing to say.
          grep -q "version: '$PKG'" src/shared/changelog.ts \
            || echo "::warning::No CHANGELOG entry for $PKG in src/shared/changelog.ts."

      - run: npm ci
      - run: npm run dist -- ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          # Globs cover all three platforms; each job only matches its own.
          # .blockmap files are listed explicitly -- `*.zip` does not match
          # `*.zip.blockmap`, and electron-updater needs them for delta updates.
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/*.zip.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Only for src/shared/changelog.ts, which the release notes are built from.
      # gh still needs -R below: a checkout gives a git repo, but the release
      # steps should not depend on that to resolve which repo they are targeting.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Each mac job emits its own latest-mac.yml listing only the arch it built.
      # Uploading both would leave whichever finished last as the live feed, so
      # half of installed Macs would stop seeing updates. Merge the two `files`
      # lists into a single feed that offers both arches; electron-updater then
      # picks the entry matching the machine it's running on.
      - name: Merge macOS update feeds
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, pathlib, yaml

          feeds = []
          for name in ('mac-x64', 'mac-arm64'):
              for p in glob.glob(f'artifacts/{name}/latest-mac.yml'):
                  feeds.append(yaml.safe_load(pathlib.Path(p).read_text()))

          if not feeds:
              print('no macOS feeds found; nothing to merge')
              raise SystemExit(0)

          merged, seen = dict(feeds[0]), set()
          files = []
          for feed in feeds:
              for f in feed.get('files', []):
                  if f['url'] not in seen:
                      seen.add(f['url'])
                      files.append(f)
          merged['files'] = files

          # Top-level path/sha512 is the legacy single-file fallback for older
          # electron-updater clients. Point it at the x64 zip: Rosetta lets an
          # Apple Silicon Mac run it, whereas an arm64 zip is unusable on Intel.
          fallback = next(
              (f for f in files if f['url'].endswith('.zip') and 'x64' in f['url']),
              next((f for f in files if f['url'].endswith('.zip')), None),
          )
          if fallback:
              merged['path'] = fallback['url']
              merged['sha512'] = fallback['sha512']

          out = pathlib.Path('upload')
          out.mkdir(exist_ok=True)
          (out / 'latest-mac.yml').write_text(yaml.safe_dump(merged, sort_keys=False))
          print((out / 'latest-mac.yml').read_text())
          PY

      - name: Stage installers
        run: |
          mkdir -p upload
          # latest-mac.yml is deliberately NOT matched here -- the merged copy is
          # already staged above and the per-arch originals must not overwrite it.
          # `latest.yml` (the Windows feed) is matched by exact name, and cp -n is
          # a second guard against any same-named file landing twice.
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.exe.blockmap' \
               -o -name '*.dmg' -o -name '*.dmg.blockmap' \
               -o -name '*.zip' -o -name '*.zip.blockmap' \
               -o -name 'latest.yml' \) \
            -exec cp -n {} upload/ \;
          ls -la upload

      # Which asset to take is not obvious from `arm64` / `x64`, and guessing wrong
      # is not symmetric: an Intel Mac handed the arm64 build gets an app that
      # cannot launch at all, while Apple Silicon handed x64 still runs under
      # Rosetta. So the table leads the release body, and Intel is called out.
      #
      # Note this does NOT rename the assets to something friendlier. The mac
      # artifactName carries ${arch} because electron-updater locates the right
      # macOS update by finding the arch in the file name -- renaming risks
      # breaking arch selection on update, which fails silently. Keep the naming
      # machine-readable and put the human guidance here.
      #
      # The names carry no version, which is what lets the README publish
      # /releases/latest/download/LightCode-<arch>.dmg links that survive every
      # release. Keep it that way: putting ${version} back breaks every download
      # link already in the wild the moment the next version ships.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Quoted heredoc so backticks stay literal; the version is substituted after.
          cat > notes.tpl <<'EOF'
          ### Download

          | Your machine | File |
          | --- | --- |
          | Windows 10/11 | [`LightCode-Setup.exe`](https://github.com/digitalscapemy/lightcode/releases/download/v__V__/LightCode-Setup.exe) |
          | Mac — Apple Silicon (M1 and newer) | [`LightCode-arm64.dmg`](https://github.com/digitalscapemy/lightcode/releases/download/v__V__/LightCode-arm64.dmg) |
          | Mac — Intel | [`LightCode-x64.dmg`](https://github.com/digitalscapemy/lightcode/releases/download/v__V__/LightCode-x64.dmg) |

          Not sure which Mac you have? **Apple menu → About This Mac** — "Chip: Apple M…"
          means **arm64**, "Processor: Intel…" means **x64**. On an Intel Mac this matters:
          the arm64 build will not launch there at all.

          **macOS 12 Monterey or newer is required.** The macOS builds are unsigned, so the
          first launch needs right-click → **Open**, or run this once:

          ```sh
          xattr -cr "/Applications/Light Code.app"
          ```
          EOF
          sed "s/__V__/${VERSION}/g" notes.tpl > notes.md

          # The app already ships hand-written, user-facing notes in
          # src/shared/changelog.ts -- that is what the in-app About dialog shows.
          # Reuse them here so the release page and the app never disagree, rather
          # than leaving GitHub with nothing but a list of PR titles.
          cat > extract.cjs <<'EOF'
          const fs = require('fs')
          // Strip the TypeScript so the data can simply be evaluated. The file is
          // otherwise plain JS, which makes this far more robust than trying to
          // pattern-match the note strings out of it.
          const js = fs
            .readFileSync('src/shared/changelog.ts', 'utf8')
            .replace(/export interface[\s\S]*?\n}\n/, '')
            .replace(/:\s*ChangelogEntry\[\]/, '')
            .replace(/export const/g, 'const')
          const entry = new Function(`${js}; return CHANGELOG`)().find(
            (e) => e.version === process.argv[2]
          )
          // No entry is not an error: the section is simply left out.
          if (!entry) process.exit(0)
          console.log(`### What's new in ${entry.version}\n`)
          for (const note of entry.notes) console.log(`- ${note}\n`)
          EOF
          { echo; node extract.cjs "$VERSION"; } >> notes.md

          # Append GitHub's generated changelog. Fetched from the API rather than
          # passing --generate-notes alongside --notes-file, because how gh combines
          # those two flags is not guaranteed; this way the result is deterministic.
          {
            echo
            echo "---"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body 2>/dev/null || true
          } >> notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # -R is required, not decoration: this job only downloads artifacts, it
          # never checks the repo out, so there is no git remote for gh to infer
          # from and every gh release call fails with "not a git repository".
          #
          # create fails when the release already exists -- a re-run, or a release
          # pre-created to carry the prerelease flag. edit then brings its body up
          # to date, and leaves prerelease/draft flags exactly as they were.
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            || gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" upload/* --clobber
