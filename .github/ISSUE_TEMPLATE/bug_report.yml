name: Bug report
description: Something in Light Code does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please check the existing issues first, and never paste API keys or tokens.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab
        2. Split right
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Light Code version
      description: Shown in the toolbar, for example v1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent in the pane (if any)
      options:
        - None, plain shell
        - Claude Code
        - Codex
        - Other
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps. Remove personal paths or secrets first.
